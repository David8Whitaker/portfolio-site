<script>
/* ============================================================
   TalatSuite v5 — โหมดออฟไลน์ (Offline Data Layer)
   จำลอง REST API ของ server.js v5 ทุก endpoint (สต็อก + ออเดอร์แขก +
   บันทึกกิจกรรม + ที่อยู่/แผนที่ + ลบบัญชี + ติดตามออเดอร์ด้วยรหัส) (ตารางเปิดทำการ +
   ล็อคอิสระต่อตลาด + บัญชี/รหัสผ่าน/รหัสล็อคหน้าจอ) ด้วยข้อมูลที่เก็บใน
   localStorage ของเบราว์เซอร์เครื่องนั้น ๆ
   → เปิดไฟล์ HTML นี้ได้ทุกที่ ไม่ต้องมีเซิร์ฟเวอร์ / อินเทอร์เน็ต
   (หากเปิดในสภาพแวดล้อมที่ห้ามใช้ storage เช่น iframe sandbox
    จะใช้หน่วยความจำชั่วคราวแทนอัตโนมัติ — ข้อมูลหายเมื่อปิดหน้า)
   ============================================================ */
(function () {
  'use strict';

  /* ธงบอก app.js ว่านี่คือ build ออฟไลน์ (ไฟล์เดียว/APK) — ใช้ปรับพฤติกรรม เช่น แผนที่เป็นปุ่มเปิดแอปแทน iframe */
  try { window.TALAT_OFFLINE = true; } catch (e) {}

  var KEY = 'talatsuite.offline.v5';

  /* ───────── ที่เก็บข้อมูล (localStorage + fallback หน่วยความจำ) ───────── */
  var persistent = false;
  var mem = null;
  try {
    var probe = '__talat_probe__';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    persistent = true;
  } catch (e) { persistent = false; }

  function loadRaw() {
    if (persistent) { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
    return mem;
  }
  function saveRaw(s) {
    if (persistent) { try { localStorage.setItem(KEY, s); return; } catch (e) {} }
    mem = s;
  }
  function clearRaw() {
    if (persistent) { try { localStorage.removeItem(KEY); } catch (e) {} }
    mem = null;
  }

  /* ───────── ค่าคงที่ / ตัวช่วย (ตรงกับ server.js v2) ───────── */
  var DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
  var CATEGORIES = ['food', 'clothes', 'fresh', 'general'];
  var ATTENDANCES = ['present', 'absent'];
  var PAY_STATUSES = ['paid', 'unpaid'];
  var PAY_METHODS = ['cash', 'promptpay'];
  var ORDER_STATUSES = ['pending', 'preparing', 'ready', 'completed'];
  var EVENT_TEXT = {
    pending: 'ร้านรับออเดอร์เข้าคิวแล้ว',
    preparing: 'กำลังเตรียมอาหาร',
    ready: 'อาหารพร้อมรับ/รอส่งแล้ว 🎉',
    completed: 'เสร็จสิ้น — ขอบคุณที่ใช้บริการ',
  };

  function todayStr() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
  }
  function periodRange(dateStr, period) {
    var p = String(dateStr).split('-').map(Number);
    var y = p[0], m = p[1], d = p[2];
    if (period === 'daily') return { from: dateStr, to: dateStr };
    if (period === 'weekly') {
      var date = new Date(Date.UTC(y, m - 1, d));
      var dow = date.getUTCDay();
      var monday = new Date(date);
      monday.setUTCDate(date.getUTCDate() - ((dow + 6) % 7));
      var sunday = new Date(monday);
      sunday.setUTCDate(monday.getUTCDate() + 6);
      return { from: monday.toISOString().slice(0, 10), to: sunday.toISOString().slice(0, 10) };
    }
    var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return { from: y + '-' + String(m).padStart(2, '0') + '-01', to: y + '-' + String(m).padStart(2, '0') + '-' + String(last).padStart(2, '0') };
  }
  function num(v, def) {
    if (def === undefined) def = null;
    if (v === undefined || v === null || v === '') return def;
    var n = Number(v);
    return Number.isFinite(n) ? n : def;
  }
  function cleanStr(v, max) {
    return String(v == null ? '' : v).trim().slice(0, max);
  }
  function HttpError(status, message) { this.status = status; this.message = message; }

  /* ───────── ระบบสมาชิก (จำลอง v3) ───────── */
  var SESSION_DAYS = 30;
  function cyrb53(str, seed) {
    /* avalanche hash (cyrb53) — ใช้ Math.imul ป้องกันการ overflow พังเหมือนเวอร์ชันเดิม */
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  function hashPassword(pw) {
    /* hash อย่างง่ายสำหรับโหมดออฟไลน์ (ไม่ใช่ scrypt — ข้อมูลตัวอย่างในเครื่องเท่านั้น) */
    var s = 'talat:' + String(pw) + ':talat';
    var a = cyrb53(s, 0), b = cyrb53(s, 7);
    var pa = a.toString(16), pb = b.toString(16);
    while (pa.length < 12) pa = '0' + pa;
    while (pb.length < 12) pb = '0' + pb;
    return pa + pb;
  }
  function newToken() {
    var t = '';
    var chars = 'abcdef0123456789';
    for (var i = 0; i < 64; i++) t += chars.charAt(Math.floor(Math.random() * 16));
    return t;
  }
  function userPublic(u) {
    return {
      id: u.id, login: u.login, role: u.role, display_name: u.display_name,
      phone: u.phone, email: u.email, market_id: u.market_id, shop_id: u.shop_id,
      has_passcode: !!u.passcode_hash,
      created_at: u.created_at, last_login_at: u.last_login_at || null,
    };
  }
  /* v6: การ์ดใบสมัคร (offline) */
  function appPublicShim(a) {
    var u = db.users.filter(function (x) { return x.id === a.user_id; })[0] || {};
    var mk = db.markets.filter(function (x) { return x.id === a.market_id; })[0] || {};
    var sh = a.shop_id ? (db.shops.filter(function (x) { return x.id === a.shop_id; })[0] || {}) : {};
    return {
      id: a.id, kind: a.kind, status: a.status, payload: a.payload || {}, deny_reason: a.deny_reason || '',
      created_at: a.created_at, decided_at: a.decided_at || null,
      user_id: a.user_id, applicant: u.display_name || '', applicant_login: u.login || '',
      applicant_phone: u.phone || '', applicant_email: u.email || '',
      market_id: a.market_id, market_name: mk.name || '', market_status: mk.status || '', market_type: mk.market_type || '',
      market_area: mk.area || '', market_address: mk.address || '',
      shop_id: a.shop_id || null, shop_name: sh.name || '', lot_code: sh.lot_code || '', shop_status: sh.status || '',
    };
  }

  /* v6: ข้อมูลเสริมตามบทบาท — ร้านค้าเห็นร้านทุกแห่ง · ผจก.เห็นสถานะตลาด */
  function authExtrasShim(u) {
    var out = {};
    if (u.role === 'vendor') {
      out.vendor_shops = db.shops.filter(function (s) { return s.owner_user_id === u.id || s.id === u.shop_id; })

  var TH_DAY_S = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส']; /* 0=อาทิตย์ */
  function parseOpenDays(s) {
    if (Array.isArray(s)) return s.map(Number).filter(function (n) { return n >= 0 && n <= 6; });
    return String(s || '').split(',').map(function (x) { return x.trim(); })
      .filter(function (x) { return /^[0-6]$/.test(x); }).map(Number);
  }
  function marketOpenToday(mk, now) {
    now = now || new Date();
    if (mk.force_open === true) return true;
    if (mk.force_open === false) return false;
    var days = parseOpenDays(mk.open_days);
    if (!days.length) return !!mk.open_today;
    return days.indexOf(now.getDay()) >= 0;
  }
  function scheduleText(mk) {
    var days = parseOpenDays(mk.open_days);
    var hasTime = !!(mk.open_time && mk.close_time);
    var time = hasTime ? mk.open_time + '–' + mk.close_time : (mk.hours_text || '');
    var dayTxt;
    if (!days.length || days.length === 7) dayTxt = 'เปิดทุกวัน';
    else if (days.length === 1) dayTxt = 'เปิดวัน' + TH_DAY_S[days[0]];
    else {
      var sorted = days.slice().sort(function (a, c) { return a - c; });
      if (sorted.indexOf(0) >= 0 && sorted.indexOf(6) >= 0) {
        var set = {};
        sorted.forEach(function (d) { set[d] = 1; });
        for (var si = 0; si < sorted.length; si++) {
          var chain = [], d = sorted[si];
          while (chain.length < sorted.length && set[d]) { chain.push(d); d = (d + 1) % 7; }
          if (chain.length === sorted.length) { sorted = chain; break; }
        }
      }
      var ranges = [], start = sorted[0], prev = sorted[0];
      for (var i = 1; i <= sorted.length; i++) {
        var dd = sorted[i];
        if (dd === (prev + 1) % 7) { prev = dd; continue; }
        ranges.push(start === prev ? TH_DAY_S[start] : TH_DAY_S[start] + '–' + TH_DAY_S[prev]);
        start = prev = dd;
      }
      dayTxt = 'เปิด ' + ranges.join(' · ');
    }
    return time ? dayTxt + ' ' + time + (hasTime ? ' น.' : '') : dayTxt;
  }
  function marketPublicSchedule(mk) {
    return {
      open_days: parseOpenDays(mk.open_days),
      open_time: mk.open_time || '',
      close_time: mk.close_time || '',
      force_open: mk.force_open == null ? null : mk.force_open,
      schedule_text: scheduleText(mk),
      open_today: marketOpenToday(mk),
    };
  }
  function validTime(t) {
    if (/^([01]?\d|2[0-3]):[0-5]\d$/.test(String(t))) return t;
    if (String(t) === '24:00') return '24:00';
    return '';
  }
  function readScheduleBody(b) {
    var out = {};
    if (b.open_days !== undefined) {

      out.open_days.sort(function (a, c) { return a - c; });
      out.open_days = out.open_days.filter(function (x, i, arr) { return arr.indexOf(x) === i; }).join(',');
    }
    if (b.open_time !== undefined) out.open_time = validTime(b.open_time);
    if (b.close_time !== undefined) out.close_time = validTime(b.close_time);
    if (b.force_open !== undefined) out.force_open = b.force_open === null ? null : Boolean(b.force_open);
    return out;
  }

  function normalizeThaiPhoneLocal(raw) {
    var d = String(raw || '').replace(/[^0-9+]/g, '');
    if (d.indexOf('+66') === 0) d = '0' + d.slice(3);
    else if (d.indexOf('66') === 0 && d.length === 11) d = '0' + d.slice(2);
    d = d.replace(/\D/g, '');
    if (/^0[2689]\d{8}$/.test(d)) return d;
    if (/^0[2-57]\d{7}$/.test(d)) return d;
    return '';
  }
  function randTrackToken() {
    var s = '';
    for (var i = 0; i < 12; i++) s += '0123456789abcdef'[Math.floor(Math.random() * 16)];
    return s;
  }
  var ROLE_TH_LOCAL = { admin: 'แอดมินระบบ', manager: 'ผู้จัดการตลาด', vendor: 'ร้านค้า/แม่ค้า', customer: 'ลูกค้า', guest: 'ลูกค้าแขก' };
  function audit(actor, action, detail, marketId, target) {
    try {
      var mk = marketId ? findMarket(marketId) : null;
      db.audit.push({
        id: db.seq.audit++,
        ts: new Date().toISOString(),
        actor_name: actor && actor.display_name ? actor.display_name : 'ระบบ',
        actor_role: actor && actor.role ? actor.role : 'system',
        action: action, detail: detail || '',
        target: target || '',
        market_id: marketId || null,
        market_name: mk ? mk.name : null,
      });
      if (db.audit.length > 800) db.audit = db.audit.slice(-800);
    } catch (e) { /* บันทึกไม่ได้ก็ไม่พัง */ }
  }
  function readStockBody(b) {
    if (b.stock === undefined) return null;
    if (b.stock === null || b.stock === '') return null;
    var s = Number(b.stock);
    if (!Number.isInteger(s) || s < 0 || s > 100000) throw new HttpError(400, 'สต็อกต้องเป็นจำนวนเต็ม 0 ขึ้นไป');
    return s;
  }
  function readGeoBodyLocal(b) {
    var geo = {};
    if (b.address !== undefined) geo.address = cleanStr(b.address, 240);
    if (b.announcement !== undefined) geo.announcement = cleanStr(b.announcement, 160);
    if (b.lat !== undefined) {
      var la = b.lat === null || b.lat === '' ? null : Number(b.lat);
      geo.lat = (la === null || !isFinite(la) || la < -90 || la > 90) ? null : la;
    }
    if (b.lng !== undefined) {
      var ln = b.lng === null || b.lng === '' ? null : Number(b.lng);
      geo.lng = (ln === null || !isFinite(ln) || ln < -180 || ln > 180) ? null : ln;
    }
    return geo;
  }

  function orderJSON(o, extra) {
    var j = {
      id: o.id, shop_id: o.shop_id, customer_id: o.customer_id, customer_user_id: o.customer_user_id || null,
      customer_name: o.customer_name, customer_contact: o.customer_contact,
      note: o.note, status: o.status, total: Number(o.total),
      created_at: o.created_at, updated_at: o.updated_at, completed_at: o.completed_at,
      is_guest: !!o.is_guest,
      items: o.items,
    };
    if (extra) Object.keys(extra).forEach(function (k) { j[k] = extra[k]; });
    return j;
  }
  function orderWithShop(o) {
    var s = findShop(o.shop_id) || {};
    var mk = findMarket(s.market_id) || {};
    return orderJSON(o, {
      shop_name: s.name || '', shop_emoji: s.emoji || '🍽️', shop_lot: s.lot_code || '',
      market_name: mk.name || '', events: o.events || [],
    });
  }

  /* ───────── ตรวจสิทธิ์ (mirror server.js v3) ───────── */
  function currentUser(token) {
    if (!token) return null;
    var sess = db.sessions[token];
    if (!sess) return null;
    if (sess.expires_at < new Date().toISOString()) {
      delete db.sessions[token]; save();
      return null;
    }
    return findUser(sess.user_id) || null;
  }
  function requireUser(token, roles) {
    var u = currentUser(token);
    if (!u) throw new HttpError(401, 'ยังไม่ได้เข้าสู่ระบบ หรือเซสชันหมดอายุ');
    if (roles && roles.indexOf(u.role) < 0) throw new HttpError(403, 'บัญชีของคุณไม่มีสิทธิ์เข้าถึงส่วนนี้');
    return u;
  }
  function requireMarketAccess(token, marketId) {
    var u = requireUser(token, ['admin', 'manager']);
    if (u.role === 'admin') return u;
    if (Number(u.market_id) !== Number(marketId)) throw new HttpError(403, 'คุณดูแลได้เฉพาะตลาดของตัวเองเท่านั้น');
    return u;
  }
  function requireShopAccess(token, shopId, opts) {
    var u = requireUser(token, (opts && opts.allowManager) ? ['admin', 'vendor', 'manager'] : ['admin', 'vendor']);
    if (u.role === 'admin') return u;
    if (u.role === 'manager') {
      var sh = findShop(shopId);
      if (sh && Number(u.market_id) === Number(sh.market_id)) return u;
      throw new HttpError(403, 'คุณดูแลได้เฉพาะร้านในตลาดของตัวเอง');
    }
    if (Number(u.shop_id) !== Number(shopId)) throw new HttpError(403, 'คุณดูแลได้เฉพาะร้านของตัวเอง');
    return u;
  }
  function startSession(u) {
    var tok = newToken();
    var exp = new Date(Date.now() + SESSION_DAYS * 86400000).toISOString();
    db.sessions[tok] = { user_id: u.id, expires_at: exp };
    save();
    return tok;
  }

  /* ตรวจ + คิดรายการอาหารจากเมนูของร้าน (ตรงกับ server.js) */
  function resolveItems(shopId, rawItems, requireAvailable) {
    if (requireAvailable === undefined) requireAvailable = true;
    if (!Array.isArray(rawItems) || rawItems.length === 0) {
      throw new HttpError(400, 'กรุณาเลือกอย่างน้อย 1 รายการอาหาร');
    }
    var clean = [];
    for (var i = 0; i < rawItems.length; i++) {
      var it = rawItems[i];
      var qty = Number(it.qty);
      if (!Number.isInteger(qty) || qty <= 0 || qty > 99) {
        throw new HttpError(400, 'รายการอาหารหรือจำนวนไม่ถูกต้อง');
      }
      if (it.menu_item_id == null) {
        var lname = cleanStr(it.name, 120);
        var lprice = num(it.unit_price);
        if (!lname || lprice === null || lprice < 0) {
          throw new HttpError(400, 'มีรายการอาหารที่ข้อมูลไม่ถูกต้อง');
        }
        clean.push({ legacy: { name: lname, price: lprice, emoji: cleanStr(it.emoji, 8) || '🍽️' }, qty: qty });
        continue;
      }
      var id = Number(it.menu_item_id);
      if (!Number.isInteger(id) || id <= 0) {
        throw new HttpError(400, 'รายการอาหารหรือจำนวนไม่ถูกต้อง');
      }
      clean.push({ id: id, qty: qty });
    }
    var total = 0;
    var resolved = [];
    clean.forEach(function (c) {
      if (c.legacy) {
        total += c.legacy.price * c.qty;
        resolved.push({ m: { id: null, name: c.legacy.name, price: c.legacy.price, emoji: c.legacy.emoji }, qty: c.qty });
        return;
      }
      var m = findMenu(c.id);
      if (!m) throw new HttpError(400, 'มีรายการอาหารที่ไม่มีในเมนูแล้ว กรุณาลองใหม่');
      if (m.shop_id !== shopId) throw new HttpError(400, 'มีรายการอาหารที่ไม่ได้มาจากร้านนี้');
      if (requireAvailable && !m.available) {
        throw new HttpError(400, '「' + m.name + '」 สินค้าหมดแล้ว');
      }
      if (requireAvailable && m.stock != null && m.stock < c.qty) {
        throw new HttpError(400, m.stock <= 0 ? '「' + m.name + '」 สินค้าหมดแล้ว' : '「' + m.name + '」 เหลือสต็อก ' + m.stock + ' ชิ้นเท่านั้น');
      }
      total += Number(m.price) * c.qty;
      resolved.push({ m: m, qty: c.qty });
    });
    return { resolved: resolved, total: total };
  }
  function itemRows(resolved) {
    return resolved.map(function (x) {
      return { menu_item_id: x.m.id, name: x.m.name, emoji: x.m.emoji, unit_price: Number(x.m.price), qty: x.qty };
    });
  }

  /* ───────── API router ───────── */
  function route(method, path, q, b, token) {
    b = b || {};
    var m;

    /* ══ health ══ */
    if (path === '/api/health') {
      return [200, { ok: true, db: true, service: 'TalatSuite', time: new Date().toISOString(), demo: true }]; /* ออฟไลน์ = ไฟล์เดโมในเครื่อง → เปิดบัญชีทดลองแบบเดียวกับเซิร์ฟเวอร์ dev (ฝั่ง client ยังมี isLocalHost() กันไว้อีกชั้น) */
    }

    /* ══ ระบบสมาชิก ══ */
    if (path === '/api/auth/register' && method === 'POST') {
      var roleR = b.role === 'vendor' ? 'vendor' : 'customer';
      var loginR = cleanStr(b.login, 60).toLowerCase();
      var nameR = cleanStr(b.display_name, 120);
      var pwR = String(b.password || '');
      if (!nameR) throw new HttpError(400, 'กรุณากรอกชื่อ');
      if (!loginR) throw new HttpError(400, roleR === 'customer' ? 'กรุณากรอกเบอร์โทรศัพท์' : 'กรุณาตั้งชื่อผู้ใช้');
      if (roleR === 'customer' && !/^0\d{8,10}$/.test(loginR.replace(/[-\s]/g, '')))
        throw new HttpError(400, 'รูปแบบเบอร์โทรศัพท์ไม่ถูกต้อง (เช่น 0891234567)');
      if (roleR === 'vendor' && !/^[\w.\-@+]{3,}$/.test(loginR))
        throw new HttpError(400, 'ชื่อผู้ใช้ต้องยาว 3 ตัวขึ้นไป (a-z, 0-9)');
      if (pwR.length < 4) throw new HttpError(400, 'รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร');
      if (db.users.some(function (u) { return u.login === loginR; }))
        throw new HttpError(400, roleR === 'customer' ? 'เบอร์โทรนี้เป็นสมาชิกอยู่แล้ว — ลองเข้าสู่ระบบ' : 'ชื่อผู้ใช้นี้ถูกใช้แล้ว');
      var uR = {
        id: db.seq.user++, login: loginR, password_hash: hashPassword(pwR), role: roleR,
        display_name: nameR, phone: roleR === 'customer' ? loginR : cleanStr(b.phone, 32),
        email: cleanStr(b.email, 120), market_id: null, shop_id: null,
        passcode_hash: null,
        created_at: new Date().toISOString(), last_login_at: new Date().toISOString(),
      };
      db.users.push(uR);
      audit(uR, 'auth.register', 'สมัครสมาชิกใหม่ (' + ROLE_TH_LOCAL[uR.role] + ')', uR.market_id, uR.login);
      var tokR = startSession(uR);
      return [201, { ok: true, token: tokR, user: userPublic(uR) }];
    }

    if (path === '/api/auth/login' && method === 'POST') {
      var loginL = cleanStr(b.login, 60).toLowerCase();
      var pwL = String(b.password || '');
      var uL = db.users.filter(function (u) { return u.login === loginL; })[0] || null;
      if (!uL || uL.password_hash !== hashPassword(pwL))
        throw new HttpError(401, 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      uL.last_login_at = new Date().toISOString();
      audit(uL, 'auth.login', 'เข้าสู่ระบบ (' + ROLE_TH_LOCAL[uL.role] + ')', uL.market_id, uL.login);
      var tokL = startSession(uL);
      return [200, Object.assign({ ok: true, token: tokL, user: userPublic(uL) }, authExtrasShim(uL)) ];
    }

    if (path === '/api/auth/logout' && method === 'POST') {
      if (token && db.sessions[token]) { delete db.sessions[token]; save(); }
      return [200, { ok: true }];
    }

    if (path === '/api/auth/me' && method === 'GET') {
      var uMe = currentUser(token);
      if (!uMe) throw new HttpError(401, 'ยังไม่ได้เข้าสู่ระบบ หรือเซสชันหมดอายุ');
      return [200, Object.assign({ user: userPublic(uMe) }, authExtrasShim(uMe))];
    }

    /* เปลี่ยนรหัสผ่าน — ตัดเซสชันอื่น ยกเว้นปัจจุบัน */
    if (path === '/api/auth/password' && method === 'PUT') {
      var uPw = currentUser(token);
      if (!uPw) throw new HttpError(401, 'ยังไม่ได้เข้าสู่ระบบ');
      var oldPw = String((b || {}).old_password || '');
      var newPw = String((b || {}).new_password || '');
      if (uPw.password_hash !== hashPassword(oldPw)) throw new HttpError(401, 'รหัสผ่านเดิมไม่ถูกต้อง');
      if (newPw.length < 4) throw new HttpError(400, 'รหัสผ่านใหม่ต้องยาวอย่างน้อย 4 ตัวอักษร');
      if (newPw === oldPw) throw new HttpError(400, 'รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม');
      uPw.password_hash = hashPassword(newPw);
      Object.keys(db.sessions).forEach(function (k) {
        if (db.sessions[k].user_id === uPw.id && k !== token) delete db.sessions[k];
      });
      audit(uPw, 'auth.password', 'เปลี่ยนรหัสผ่าน (ไล่เซสชันอื่น)', uPw.market_id, uPw.login);
      save();
      return [200, { ok: true, user: userPublic(uPw) }];
    }

    /* ลบบัญชีตัวเอง (v5) */
    if (path === '/api/auth/me' && method === 'DELETE') {
      var uDel = requireUser(token);
      if (uDel.role === 'admin' && db.users.filter(function (x) { return x.role === 'admin'; }).length <= 1)
        throw new HttpError(400, 'ไม่สามารถลบบัญชีแอดมินคนสุดท้ายของระบบได้ — ให้สร้างแอดมินคนใหม่ก่อน');
      audit(uDel, 'user.delete', 'ลบบัญชีตัวเอง (' + ROLE_TH_LOCAL[uDel.role] + ' "' + uDel.display_name + '")', uDel.market_id, uDel.login);
      delete db.sessions[token];
      db.orders = db.orders.map(function (o) {
        if (o.customer_user_id === uDel.id) { o.customer_user_id = null; }
        return o;
      });
      db.users = db.users.filter(function (x) { return x.id !== uDel.id; });
      save();
      return [200, { ok: true }];
    }

    /* ตั้ง/เปลี่ยน/ลบรหัสล็อคหน้าจอ */
    if (path === '/api/auth/passcode' && method === 'PUT') {
      var uPc = currentUser(token);
      if (!uPc) throw new HttpError(401, 'ยังไม่ได้เข้าสู่ระบบ');
      var pwPc = String((b || {}).password || '');
      if (uPc.password_hash !== hashPassword(pwPc)) throw new HttpError(401, 'รหัสผ่านไม่ถูกต้อง');
      var pc = (b || {}).passcode;
      if (pc === null || pc === undefined || pc === '') {
        uPc.passcode_hash = null;
        audit(uPc, 'auth.passcode', 'ลบรหัสล็อคหน้าจอ', uPc.market_id, uPc.login);
        save();
        return [200, { ok: true, has_passcode: false }];
      }
      pc = String(pc);
      if (!/^[0-9]{4,8}$/.test(pc)) throw new HttpError(400, 'รหัสล็อคเป็นตัวเลข 4–8 หลัก');
      uPc.passcode_hash = hashPassword(pc);
      audit(uPc, 'auth.passcode', 'ตั้งรหัสล็อคหน้าจอใหม่', uPc.market_id, uPc.login);
      save();
      return [200, { ok: true, has_passcode: true }];
    }

    /* ปลดล็อคหน้าจอ */
    if (path === '/api/auth/verify-passcode' && method === 'POST') {
      var uV = currentUser(token);
      if (!uV) throw new HttpError(401, 'ยังไม่ได้เข้าสู่ระบบ');
      if (!uV.passcode_hash) throw new HttpError(400, 'บัญชีนี้ไม่ได้ตั้งรหัสล็อค');
      if (uV.passcode_hash !== hashPassword(String((b || {}).passcode || '')))
        throw new HttpError(401, 'รหัสล็อคไม่ถูกต้อง');
      return [200, { ok: true }];
    }

    /* ══ ตลาด ══ */
    if (path === '/api/markets' && method === 'GET') {
      var uMk = currentUser(token);
      var isAdminMk = uMk && uMk.role === 'admin';
      var isMgrMk = uMk && uMk.role === 'manager' && uMk.market_id;
      var markets = db.markets.slice().sort(function (a, c) { return (a.sort_order - c.sort_order) || (a.id - c.id); })
        .filter(function (mk) {
          var st = mk.status || 'approved';
          if (isAdminMk) return true;
          if (isMgrMk) return st === 'approved' || mk.id === uMk.market_id;
          return st === 'approved';
        })
        .map(function (mk) {
          var shops = db.shops.filter(function (s) { return s.market_id === mk.id && (s.status || 'approved') === 'approved'; });
          return {
            id: mk.id, name: mk.name, area: mk.area, description: mk.description,
            hours_text: mk.hours_text, emoji: mk.emoji,
            address: mk.address || '', lat: mk.lat == null ? null : Number(mk.lat),
            lng: mk.lng == null ? null : Number(mk.lng), announcement: mk.announcement || '',
            status: mk.status || 'approved', market_type: mk.market_type || 'night',
            shops_total: shops.length,
            shops_open: shops.filter(function (s) { return s.is_open; }).length,
            lots_total: db.lots.filter(function (l) { return l.market_id === mk.id; }).length,
            ...scheduleOf(mk),
          };
        });
      return [200, { markets: markets }];
    }

    /* ═══ v6: ระบบสมัคร-อนุมัติ (โหมดออฟไลน์) ═══ */
    if (path === '/api/public/market-lots' && method === 'GET') {
      var plMid = Number(q.market_id);
      var plMk = db.markets.filter(function (m) { return m.id === plMid; })[0];
      if (!plMk || (plMk.status || 'approved') !== 'approved') throw new HttpError(404, 'ไม่พบตลาดนี้');
      var lots = db.lots.filter(function (l) { return l.market_id === plMid; })
        .sort(function (a, c) { return (a.row_label === c.row_label ? a.position - c.position : (a.row_label < c.row_label ? -1 : 1)); })
        .map(function (l) {
          var t = db.shops.filter(function (s) { return s.market_id === plMid && s.lot_code === l.code && (s.status === 'pending' || (s.status || 'approved') === 'approved'); })[0];
          return { code: l.code, row_label: l.row_label, position: l.position, rent: Number(l.rent_amount), taken: !!t, taken_by: t ? t.name : '', taken_status: t ? (t.status || 'approved') : '' };
        });
      return [200, { lots: lots }];
    }

    if (path === '/api/apply/shop' && method === 'POST') {
      var asU = currentUser(token);
      var asMid = Number(b.market_id);
      var asMk = db.markets.filter(function (m) { return m.id === asMid; })[0];
      if (!asMk || (asMk.status || 'approved') !== 'approved') throw new HttpError(403, 'ตลาดนี้ยังไม่เปิดรับร้านค้าใหม่');
      if (asU && asU.role !== 'vendor') throw new HttpError(403, 'บัญชีนี้ไม่ใช่บัญชีร้านค้า');
      var asTok = token;
      if (!asU) {
        var asLogin = cleanStr(b.login, 60).toLowerCase();
        if (!cleanStr(b.display_name, 120)) throw new HttpError(400, 'กรุณากรอกชื่อเจ้าของร้าน');
        if (asLogin.length < 3) throw new HttpError(400, 'ชื่อผู้ใช้ต้องยาวอย่างน้อย 3 ตัวอักษร');
        if (String(b.password || '').length < 4) throw new HttpError(400, 'รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร');
        if (db.users.some(function (x) { return x.login === asLogin; })) throw new HttpError(400, 'ชื่อผู้ใช้นี้ถูกใช้แล้ว');
        asU = addUser(asLogin, String(b.password || ''), 'vendor', cleanStr(b.display_name, 120), { phone: cleanStr(b.phone, 32), email: cleanStr(b.email, 120) });
        asTok = 't' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        db.sessions[asTok] = { user_id: asU.id };
      }
      if (db.shops.some(function (s) { return s.market_id === asMid && (s.owner_user_id === asU.id || s.id === asU.shop_id) && (s.status === 'pending' || (s.status || 'approved') === 'approved'); }))
        throw new HttpError(409, 'คุณมีคำขอ/ร้านในตลาดนี้อยู่แล้ว');
      var asLot = cleanStr(b.lot_code, 10);
      if (asLot) {
        if (!db.lots.some(function (l) { return l.code === asLot && l.market_id === asMid; })) throw new HttpError(404, 'ไม่พบล็อค ' + asLot + ' ในตลาดนี้');

      return [200, { order: orderWithShop(oT), events: oT.events || [] }];
    }

    if ((m = path.match(/^\/api\/orders\/(\d+)\/events$/)) && method === 'GET') {
      var oE = findOrder(m[1]);
      if (!oE) throw new HttpError(404, 'ไม่พบออเดอร์นี้');
      return [200, { events: oE.events || [] }];
    }

    /* ══ คอนโซลแอดมิน ══ */
    if (path === '/api/admin/stats' && method === 'GET') {
      requireUser(token, ['admin']);
      var todayA = todayStr();
      var mkStats = db.markets.slice().sort(function (a, c) { return (a.sort_order - c.sort_order) || (a.id - c.id); }).map(function (mk) {
        var mkShops = db.shops.filter(function (s) { return s.market_id === mk.id; });
        var mkLots = db.lots.filter(function (l) { return l.market_id === mk.id; });
        var occCnt = 0, rentCnt = 0;
        mkLots.forEach(function (l) {
          var st = db.lotDay[lotDayKey(mk.id, l.code, todayA)];
          if (st && st.vendor_name !== '') {
            occCnt++;
            if (st.payment_status === 'paid') rentCnt += Number(st.rent_amount || l.rent_amount);
          }
        });
        var mkOrders = db.orders.filter(function (o) {
          var s = findShop(o.shop_id);
          return s && s.market_id === mk.id && String(o.created_at.slice(0, 10)) === todayA;
        });
        var mgr = db.users.filter(function (u) { return u.role === 'manager' && Number(u.market_id) === mk.id; })[0];
        return {
          id: mk.id, name: mk.name, emoji: mk.emoji,
          area: mk.area || '', address: mk.address || '', announcement: mk.announcement || '',
          open_today: marketOpenToday(mk),
          schedule_text: scheduleText(mk),
          open_days: parseOpenDays(mk.open_days),
          open_time: mk.open_time || '', close_time: mk.close_time || '',
          force_open: mk.force_open == null ? null : mk.force_open,
          manager: mgr ? mgr.display_name : '— ยังไม่มีผู้จัดการ',
          lots: mkLots.length, occupied: occCnt,
          shops: mkShops.length, shops_open: mkShops.filter(function (s) { return s.is_open; }).length,
          orders_today: mkOrders.length,
          guest_orders_today: mkOrders.filter(function (o) { return o.is_guest; }).length,
          gmv_today: mkOrders.reduce(function (s2, o) { return s2 + Number(o.total); }, 0),
          rent_today: rentCnt,
        };
      });
      var byRole = {};
      db.users.forEach(function (u) { byRole[u.role] = (byRole[u.role] || 0) + 1; });
      var ordersToday = db.orders.filter(function (o) { return String(o.created_at.slice(0, 10)) === todayA; });
      var rentToday = 0;
      Object.keys(db.payments).forEach(function (k) {
        var p = db.payments[k];
        if (p.day === todayA) rentToday += Number(p.amount);
      });
      var rentAll = 0;
      Object.keys(db.payments).forEach(function (k) { rentAll += Number(db.payments[k].amount); });
      var custRows = db.users.filter(function (u) { return u.role === 'customer'; }).map(function (c) {
        var co = db.orders.filter(function (o) { return o.customer_user_id === c.id; });
        return {
          display_name: c.display_name, login: c.login, phone: c.phone, created_at: c.created_at,
          orders: co.length, spend: co.reduce(function (s2, o) { return s2 + Number(o.total); }, 0),
        };
      }).sort(function (a, c) { return c.spend - a.spend; });
      return [200, {
        totals: {
          markets: db.markets.length,
          managers: byRole.manager || 0, vendors: byRole.vendor || 0, customers: byRole.customer || 0,
          shops: db.shops.length,
          orders_today: ordersToday.length,
          guest_orders_today: ordersToday.filter(function (o) { return o.is_guest; }).length,
          gmv_today: ordersToday.reduce(function (s2, o) { return s2 + Number(o.total); }, 0),
          orders_all: db.orders.length,
          gmv_all: db.orders.reduce(function (s2, o) { return s2 + Number(o.total); }, 0),
          rent_today: rentToday, rent_all: rentAll,
        },
        markets: mkStats,
        recent_customers: custRows.slice(0, 8),
        recent_orders: db.orders.slice().sort(function (a, c) { return c.id - a.id; }).slice(0, 8).map(function (o) {
          var s = findShop(o.shop_id) || {};
          var mk = findMarket(s.market_id) || {};
          return { id: o.id, customer_name: o.customer_name, total: Number(o.total), status: o.status, created_at: o.created_at, shop_name: s.name || '', shop_emoji: s.emoji || '🍽️', market_name: mk.name || '' };
        }),
      }];
    }

    /* v5: บันทึกกิจกรรม (แอดมิน) */
    if (path === '/api/admin/audit' && method === 'GET') {
      requireUser(token, ['admin']);
      var limA = Math.min(Math.max(num(q.limit, 200), 1), 500);
      var rowsA = db.audit.slice().reverse().filter(function (e) {
        if (q.market_id && Number(q.market_id) > 0 && Number(e.market_id) !== Number(q.market_id)) return false;
        if (q.role && e.actor_role !== q.role) return false;
        if (q.q) {
          var needle = String(q.q).toLowerCase();
          var hay = (e.detail + ' ' + e.actor_name + ' ' + e.action + ' ' + (e.target || '')).toLowerCase();
          if (hay.indexOf(needle) < 0) return false;
        }
        return true;
      }).slice(0, limA);
      return [200, { entries: rowsA }];
    }

    if (path === '/api/admin/audit.csv' && method === 'GET') {
      requireUser(token, ['admin']);
      var rowsC = db.audit.slice().reverse().slice(0, 2000);
      var csvC = '\uFEFF' + ['id,เวลา,ผู้กระทำ,บทบาท,การกระทำ,รายละเอียด,เป้าหมาย,ตลาด'].concat(rowsC.map(function (e) {
        return [e.id, e.ts, e.actor_name, ROLE_TH_LOCAL[e.actor_role] || e.actor_role, e.action, e.detail, e.target || '', e.market_name || ''].map(function (v) {
          return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        }).join(',');
      })).join('\r\n');
      return [200, csvC, 'csv'];
    }

    if (path === '/api/admin/users' && method === 'GET') {
      requireUser(token, ['admin']);
      var roleOrder = { admin: 0, manager: 1, vendor: 2, customer: 3 };
      var usersRows = db.users.slice().sort(function (a, c) { return (roleOrder[a.role] - roleOrder[c.role]) || (a.id - c.id); }).map(function (u) {
        var mkU = u.market_id ? findMarket(u.market_id) : null;
        var shU2 = u.shop_id ? findShop(u.shop_id) : null;
        return {
          id: u.id, login: u.login, role: u.role, display_name: u.display_name,
          phone: u.phone, email: u.email, created_at: u.created_at, last_login_at: u.last_login_at || null,
          market_id: u.market_id, market_name: mkU ? mkU.name : null,
          shop_id: u.shop_id, shop_name: shU2 ? shU2.name : null,
          has_passcode: !!u.passcode_hash,
        };
      });
      return [200, { users: usersRows }];
    }

    if (path === '/api/admin/users' && method === 'POST') {
      requireUser(token, ['admin']);
      var roleA = b.role === 'manager' || b.role === 'vendor' ? b.role : null;
      if (!roleA) throw new HttpError(400, 'ประเภทบัญชีต้องเป็น manager หรือ vendor');
      var loginA = cleanStr(b.login, 60).toLowerCase();
      var nameA = cleanStr(b.display_name, 120);
      var pwA = String(b.password || '');
      if (!nameA) throw new HttpError(400, 'กรุณากรอกชื่อ');
      if (loginA.length < 3 || !/^[\w.\-@+]+$/.test(loginA)) throw new HttpError(400, 'ชื่อผู้ใช้ต้องยาว 3 ตัวขึ้นไป (a-z, 0-9)');
      if (pwA.length < 4) throw new HttpError(400, 'รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร');
      if (db.users.some(function (u) { return u.login === loginA; })) throw new HttpError(400, 'ชื่อผู้ใช้นี้ถูกใช้แล้ว');
      var marketA = null, shopA = null;
      if (roleA === 'manager') {
        marketA = num(b.market_id);
        if (!marketA) throw new HttpError(400, 'เลือกตลาดที่ผู้จัดการนี้ดูแล');
        if (!findMarket(marketA)) throw new HttpError(404, 'ไม่พบตลาดนี้');
        if (db.users.some(function (u) { return u.role === 'manager' && Number(u.market_id) === marketA; }))
          throw new HttpError(400, 'ตลาดนี้มีผู้จัดการอยู่แล้ว');
      }
      if (roleA === 'vendor' && b.shop_id) {
        shopA = num(b.shop_id);
        if (!findShop(shopA)) throw new HttpError(404, 'ไม่พบร้านนี้');
        if (db.users.some(function (u) { return Number(u.shop_id) === shopA; }))
          throw new HttpError(400, 'ร้านนี้มีบัญชีร้านค้าอยู่แล้ว');
      }
      var uA = {
        id: db.seq.user++, login: loginA, password_hash: hashPassword(pwA), role: roleA,
        display_name: nameA, phone: cleanStr(b.phone, 32), email: cleanStr(b.email, 120),
        market_id: marketA, shop_id: shopA,
        passcode_hash: null,
        created_at: new Date().toISOString(), last_login_at: null,
      };
      db.users.push(uA);
      audit(requireUser(token, ['admin']), 'user.create', 'สร้างบัญชี ' + ROLE_TH_LOCAL[uA.role] + ' "' + uA.display_name + '" (' + uA.login + ')', uA.market_id, uA.login);
      save();
      return [201, { ok: true, user: userPublic(uA) }];
    }

    if ((m = path.match(/^\/api\/admin\/users\/(\d+)$/)) && method === 'PUT') {
      requireUser(token, ['admin']);
      var uEd = findUser(m[1]);
      if (!uEd) throw new HttpError(404, 'ไม่พบบัญชีนี้');
      if (b.display_name !== undefined) {
        uEd.display_name = cleanStr(b.display_name, 120);
        if (!uEd.display_name) throw new HttpError(400, 'ชื่อห้ามว่าง');
      }
      if (b.phone !== undefined) uEd.phone = cleanStr(b.phone, 32);
      if (b.email !== undefined) uEd.email = cleanStr(b.email, 120);
      if (b.password !== undefined) {
        if (String(b.password).length < 4) throw new HttpError(400, 'รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร');
        uEd.password_hash = hashPassword(b.password);
        /* ตัดเซสชันเดิม */
        Object.keys(db.sessions).forEach(function (k) { if (db.sessions[k].user_id === uEd.id) delete db.sessions[k]; });
      }
      if (uEd.role === 'manager' && b.market_id !== undefined) uEd.market_id = num(b.market_id);
      if (uEd.role === 'vendor' && b.shop_id !== undefined) uEd.shop_id = num(b.shop_id);
      save();
      return [200, { ok: true, user: userPublic(uEd) }];
    }

    if ((m = path.match(/^\/api\/admin\/users\/(\d+)$/)) && method === 'DELETE') {
      var uAdm = requireUser(token, ['admin']);
      var uRm = findUser(m[1]);
      if (!uRm) throw new HttpError(404, 'ไม่พบบัญชีนี้');
      if (uRm.id === uAdm.id) throw new HttpError(400, 'ลบบัญชีตัวเองไม่ได้');
      if (uRm.role === 'admin' && db.users.filter(function (x) { return x.role === 'admin'; }).length <= 1)
        throw new HttpError(400, 'ไม่สามารถลบแอดมินคนสุดท้ายของระบบได้');
      audit(uAdm, 'user.delete', 'ลบบัญชี ' + ROLE_TH_LOCAL[uRm.role] + ' "' + uRm.display_name + '" (' + uRm.login + ')', uRm.market_id, uRm.login);
      db.users = db.users.filter(function (u) { return u.id !== uRm.id; });
      Object.keys(db.sessions).forEach(function (k) { if (db.sessions[k].user_id === uRm.id) delete db.sessions[k]; });
      save();
      return [200, { ok: true }];
    }

    if (path === '/api/admin/customers' && method === 'GET') {
      requireUser(token, ['admin']);
      var custs = db.users.filter(function (u) { return u.role === 'customer'; }).map(function (c) {
        var co = db.orders.filter(function (o) { return o.customer_user_id === c.id; });
        var mkSet = {};
        co.forEach(function (o) { var s = findShop(o.shop_id); if (s) mkSet[s.market_id] = 1; });
        return {
          id: c.id, login: c.login, display_name: c.display_name, phone: c.phone, email: c.email,
          created_at: c.created_at, last_login_at: c.last_login_at || null,
          orders: co.length, spend: co.reduce(function (s2, o) { return s2 + Number(o.total); }, 0),
          markets: Object.keys(mkSet).length,
        };
      }).sort(function (a, c) { return c.spend - a.spend; });
      return [200, { customers: custs }];
    }

    if (path === '/api/admin/customers.csv' && method === 'GET') {
      requireUser(token, ['admin']);
      function csvEsc(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
      var headA = ['เบอร์โทร/ผู้ใช้', 'ชื่อ', 'เบอร์ติดต่อ', 'อีเมล', 'สมัครเมื่อ', 'จำนวนออเดอร์', 'ยอดใช้จ่ายรวม (บาท)'].map(csvEsc).join(',');
      var linesA = db.users.filter(function (u) { return u.role === 'customer'; }).map(function (c) {
        var co = db.orders.filter(function (o) { return o.customer_user_id === c.id; });
        return [c.login, c.display_name, c.phone, c.email,
          String(c.created_at).replace('T', ' ').slice(0, 16),
          co.length, co.reduce(function (s2, o) { return s2 + Number(o.total); }, 0)].map(csvEsc).join(',');
      });
      var csv = '\uFEFF' + [headA].concat(linesA).join('\r\n');
      return [200, csv, 'csv'];
    }

    throw new HttpError(404, 'ไม่พบ API นี้');
  }

  /* ───────── แทนที่ window.fetch ───────── */
  var realFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;

  function makeRes(status, data, kind) {
    var isCsv = kind === 'csv';
    var text = isCsv ? String(data) : JSON.stringify(data);
    return Promise.resolve({
      ok: status >= 200 && status < 300,
      status: status,
      statusText: '',
      headers: { get: function (k) { return String(k).toLowerCase() === 'content-type' ? (isCsv ? 'text/csv; charset=utf-8' : 'application/json') : null; } },
      json: function () { return Promise.resolve(data); },
      text: function () { return Promise.resolve(text); },
      blob: function () { return Promise.resolve(new Blob([text], { type: isCsv ? 'text/csv; charset=utf-8' : 'application/json' })); },
      arrayBuffer: function () { return Promise.resolve(new TextEncoder().encode(text).buffer); },
      clone: function () { return this; },
    });
  }

  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) ? input.url : String(input);
    if (url.charAt(0) !== '/' || url.indexOf('/api/') !== 0) {
      return realFetch ? realFetch(input, init) : makeRes(404, { error: 'ไม่พบทรัพยากร' });
    }
    var method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    var body = null;
    if (init && init.body) { try { body = JSON.parse(init.body); } catch (e) { body = null; } }

    var qi = url.indexOf('?');
    var path = qi === -1 ? url : url.slice(0, qi);
    var q = {};
    if (qi !== -1) {
      url.slice(qi + 1).split('&').forEach(function (kv) {
        if (!kv) return;
        var pr = kv.split('=');
        q[decodeURIComponent(pr[0].replace(/\+/g, '%20'))] = decodeURIComponent((pr[1] || '').replace(/\+/g, '%20'));
      });
    }

    /* ดึง token จาก header Authorization */
    var token = null;
    try {
      var h = (init && init.headers) || (input && input.headers) || null;
      if (h) {
        if (typeof h.get === 'function') {
          var av = h.get('Authorization') || h.get('authorization');
          if (av && av.indexOf('Bearer ') === 0) token = av.slice(7);
        } else {
          Object.keys(h).forEach(function (hk) {
            if (String(hk).toLowerCase() === 'authorization') {
              var hv = String(h[hk]);
              if (hv.indexOf('Bearer ') === 0) token = hv.slice(7);
            }
          });
        }
      }
    } catch (e2) { token = null; }

    try {
      var r = route(method, path, q, body, token);
      return makeRes(r[0], r[1], r[2]);
    } catch (e) {
      if (e instanceof HttpError) return makeRes(e.status, { error: e.message });
      return makeRes(500, { error: 'เกิดข้อผิดพลาดภายใน กรุณาลองใหม่' });
    }
  };

  /* ───────── UI เสริมของโหมดออฟไลน์: ปุ่มรีเซ็ต + ป้ายสถานะ ───────── */
  function addOfflineUI() {
    var style = document.createElement('style');
    style.textContent =
      '#offline-reset{position:fixed;right:12px;bottom:calc(var(--bb-h,78px) + 14px + env(safe-area-inset-bottom,0px));z-index:55;' +
      'border:1px solid rgba(255,255,255,.2);background:rgba(10,32,23,.86);color:#e9f5ee;' +
      'font:600 12px/1 Kanit,system-ui,sans-serif;padding:9px 13px;border-radius:999px;cursor:pointer;' +
      'backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .2s}' +
      '#offline-reset.arm{background:#7c2d1e;border-color:#ff9d8a;color:#ffe9e4}' +
      '@media (min-width:1080px){#offline-reset{bottom:16px}}';
    document.head.appendChild(style);

    var btn = document.createElement('button');
    btn.id = 'offline-reset';
    btn.type = 'button';
    var LABEL = persistent ? '↺ รีเซ็ตข้อมูลตัวอย่าง' : '↺ รีเซ็ตตัวอย่าง';
    btn.textContent = LABEL;
    btn.title = 'ล้างข้อมูลทั้งหมดในเครื่องนี้ แล้วกลับไปชุดข้อมูลตัวอย่างเริ่มต้น';
    var armed = false, timer = null;
    btn.addEventListener('click', function () {
      if (!armed) {
        armed = true;
        btn.classList.add('arm');
        btn.textContent = 'แตะอีกครั้งเพื่อยืนยัน';
        clearTimeout(timer);
        timer = setTimeout(function () {
          armed = false;
          btn.classList.remove('arm');
          btn.textContent = LABEL;
        }, 2800);
        return;
      }
      clearTimeout(timer);
      clearRaw();
      try {
        /* ล้างความจำบทบาท/ตลาด/ร้าน ของแอปด้วย = กลับสู่สถานะแรกเริ่ม */
        ['talatsuite.role', 'talatsuite.market', 'talatsuite.shop', 'talatsuite.cid', 'talatsuite.token'].forEach(function (k) {
          try { localStorage.removeItem(k); } catch (e) {}
        });
        /* ตัด hash (#/role) ออกด้วย ไม่งั้นแอปจะกลับเข้าบทบาทเดิมจาก URL หลังรีโหลด */
        location.replace(location.href.split('#')[0]);
      } catch (e) { db = freshDB(); save(); }
    });
    document.body.appendChild(btn);

    /* ป้ายสถานะ: แทนข้อความ "เชื่อมต่อ PostgreSQL" ด้วยข้อความโหมดออฟไลน์ */
    var sideText = persistent ? 'ออฟไลน์ · ข้อมูลเก็บในเครื่องนี้' : 'โหมดพรีวิว · ไม่บันทึกถาวร';
    setInterval(function () {
      var side = document.querySelector('#db-chip-side .tx');
      if (side && side.textContent.indexOf('PostgreSQL') >= 0) side.textContent = sideText;
      var head = document.querySelector('#db-chip-head');
      if (head && (head.textContent.trim() === 'ออนไลน์' || head.textContent.trim() === '…')) {
        head.innerHTML = '<span class="dot" style="background:#7dffa8"></span>พร้อมใช้งาน';
      }
    }, 700);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addOfflineUI);
  } else {
    addOfflineUI();
  }
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   TalatSuite i18n — ไทย (ค่าเริ่มต้น) / English
   เครื่องแปลภาษาแบบ DOM-pass:
   - แอปเขียน UI เป็นภาษาไทยตามปกติ
   - เมื่อเปิดโหมด EN เครื่องจะแปลข้อความที่แสดงผลทั้งหมด
     (text node + placeholder + title + aria-label) อัตโนมัติ
     ผ่าน MutationObserver — ไม่ต้องแก้โค้ดหน้าแอปเลย
   - เพิ่มภาษาใหม่ภายหลัง: เพิ่ม key ใน EXACT/PATTERNS ของภาษานั้น
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const LANG_KEY = 'talatsuite.lang';
  const SUPPORTED = ['th', 'en'];
  const LANG_LABEL = { th: 'ไทย', en: 'English' };
  let memLang = 'th';
  function readLang() {
    try {
      const v = localStorage.getItem(LANG_KEY);
      if (v && SUPPORTED.includes(v)) return v;
    } catch (e) { /* sandbox/preview */ }
    return memLang;
  }
  function writeLang(l) {
    memLang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ใช้ memLang แทน */ }
  }

  /* ---------- พจนานุกรม: คำตรงตัว (ไทย → EN) ---------- */

  const TH_RE = /[\u0E00-\u0E7F]/;

  const TOKEN_LIST = Object.entries(TOKENS).sort((a, b) => b[0].length - a[0].length);
  const SEP_RE = /(\s·\s|\s—\s)/;
  const LEAD_RE = /^([^A-Za-z0-9\u0E00-\u0E7F]*)([\s\S]*)$/;

  function translate(s) {
    if (typeof s !== 'string' || lang !== 'en' || !TH_RE.test(s)) return s;
    const out = tryTranslate(s);
    if (out !== null) return out;
    /* โทเคน (คำ/วลีฝังในประโยค) แล้วลอง exact/pattern อีกรอบ */
    let t = s;
    for (const [k, v] of TOKEN_LIST) {
      if (t.includes(k)) t = t.split(k).join(v);
    }
    if (t !== s) {
      const out2 = tryTranslate(t);
      if (out2 !== null) return out2;
      if (!TH_RE.test(t)) return t;
    }
    /* ประโยคคั่นหลายท่อน ("ก · ข — ค") → แปลทีละท่อนแล้วต่อกลับ */
    if (SEP_RE.test(s)) {
      return s.split(SEP_RE).map((seg) => (SEP_RE.test(seg) ? seg : translate(seg))).join('');
    }
    return t !== s ? t : s;

  function tryTranslate(s) {
    const key = s.trim();
    if (!key) return null;
    if (EXACT[key]) return s.replace(key, EXACT[key]);
    for (const [re, rep] of PATTERNS) {
      const m = key.match(re);
      if (m) {
        const res = typeof rep === 'function' ? rep(m) : key.replace(re, rep);
        return s.replace(key, res);
      }
    }
    const lm = key.match(LEAD_RE);
    if (lm && lm[1].trim()) {
      const k2 = lm[2].trim();
      if (k2 && k2 !== key) {
        if (EXACT[k2]) return s.replace(key, lm[1].trim() + ' ' + EXACT[k2]);
        for (const [re, rep] of PATTERNS) {
          const m = k2.match(re);
          if (m) {
            const res = typeof rep === 'function' ? rep(m) : k2.replace(re, rep);
            return s.replace(key, lm[1].trim() + ' ' + res);
          }
        }
      }
    }
    return null;
  }

  };
  function revertNode(root) {
    if (!root) return;
    const walk = (node) => {
      if (node.nodeType === 3) {
        const o = origText.get(node);
        if (o != null && o !== node.nodeValue) node.nodeValue = o;
        return;
      }
      if (node.nodeType !== 1 || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') return;
      const o = origAttr.get(node);
      if (o) for (const a in o) { try { if (node.getAttribute(a) != null) node.setAttribute(a, o[a]); } catch (e) {} }
      for (let c = node.firstChild; c; c = c.nextSibling) walk(c);
    };
    walk(root.nodeType ? root : document.body);
  }
  function translateNode(root) {
    if (lang !== 'en' || !root) return;
    if (root.nodeType === 3) {
      const v = translate(root.nodeValue);
      if (v !== root.nodeValue) root.nodeValue = v;
      return;
    }
    if (root.nodeType !== 1) return;
    if (root.tagName === 'SCRIPT' || root.tagName === 'STYLE') return;
    for (const a of ATTRS) {
      const v = root.getAttribute && root.getAttribute(a);
      if (v && TH_RE.test(v)) {
        const t = translate(v);
        if (t !== v) { keepAttr(root, a, v); root.setAttribute(a, t); }
      }
    }
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        if (!n.nodeValue || !TH_RE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes) {
      const v = translate(n.nodeValue);
      if (v !== n.nodeValue) { keepText(n); n.nodeValue = v; }
    }
    root.querySelectorAll && root.querySelectorAll('*').forEach((el) => {
      for (const a of ATTRS) {
        const v = el.getAttribute && el.getAttribute(a);
        if (v && TH_RE.test(v)) {
          const t = translate(v);
          if (t !== v) { keepAttr(el, a, v); el.setAttribute(a, t); }
        }
      }
    });
  }

  /* สังเกตการเปลี่ยนแปลง DOM → แปลใหม่อัตโนมัติ (เฉพาะโหมด EN) */
  let mo = null;
  function startObserver() {
    if (mo || !document.body) return;
    mo = new MutationObserver((muts) => {
      if (lang !== 'en') return;
      for (const mu of muts) {
        if (mu.type === 'characterData' && mu.target.nodeValue) {
          const v = translate(mu.target.nodeValue);
          if (v !== mu.target.nodeValue) { keepText(mu.target); mu.target.nodeValue = v; }
        } else if (mu.type === 'attributes' && mu.target.nodeType === 1) {
          const v = mu.target.getAttribute(mu.attributeName);
          if (v) {
            const t = translate(v);
            if (t !== v) { keepAttr(mu.target, mu.attributeName, v); mu.target.setAttribute(mu.attributeName, t); }
          }
        }
        for (const n of mu.addedNodes) translateNode(n);
      }
    });
    mo.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS });
  }

  let lang = readLang();

  function apply(langTo) {
    if (lang === 'en' && langTo !== 'en' && document.body) {
      try { revertNode(document.body); } catch (e) { /* ปล่อยผ่าน */ }
    }
    lang = langTo;
    writeLang(langTo);
  }

  window.TS = {
    get lang() { return lang; },
    get supported() { return SUPPORTED.slice(); },
    label(l) { return LANG_LABEL[l] || l; },
    translate,
    translateNode,
    revertNode,
    setLang(l) {
      if (!SUPPORTED.includes(l) || l === lang) return;
      apply(l);
      /* แอปหลักลงทะเบียน hook ไว้ — เรียกเพื่อ re-render ทั้งหน้า แล้วค่อยแปลซ้ำ */
      if (typeof window.__tsRerender === 'function') {
        try { window.__tsRerender(); } catch (e) { /* ปล่อยผ่าน */ }
      }
      translateNode(document.body);
      document.documentElement.setAttribute('lang', l);
    },
    init() {
      document.documentElement.setAttribute('lang', lang);
      startObserver();
      if (lang === 'en') translateNode(document.body);
    },
  };
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════
   TalatSuite v2 — Frontend SPA (ภาษาไทยทั้งหมด)

   🏪 ผู้จัดการตลาด · 🍜 ร้านค้า/แม่ค้า · 🛒 ลูกค้าสั่งอาหาร
   ═══════════════════════════════════════════════════════════ */
'use strict';

/* ─────────────── utilities ─────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
const overlayRoot = $('#overlay-root');
const toastRoot = $('#toast-root');
const viewEl = $('#view');

const CAT_TH = { food: 'อาหาร/เครื่องดื่ม', clothes: 'เสื้อผ้า', fresh: 'ของสด', general: 'ทั่วไป' };
const METHOD_TH = { cash: 'เงินสด', promptpay: 'สแกน PromptPay' };
const STATUS_TH = { pending: 'รอดำเนินการ', preparing: 'กำลังอบ/กำลังทำ', ready: 'พร้อมรับ/ส่ง', completed: 'เสร็จสิ้น' };

const ORDER_STATUSES = ['pending', 'preparing', 'ready', 'completed'];
const EMOJI_CHOICES = ['🍕', '🍍', '🦐', '🍜', '🍗', '🍚', '🥤', '☕', '🍰', '🌶️', '🥗', '🍢', '🧋', '🍵', '🥩', '🍟', '🥐', 'BBQ'];

const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MONTHS_S = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_DAYS_S = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

const parseDate = (s) => {
  const str = String(s || '');
  if (str.includes('T')) { const dt = new Date(str); return isNaN(dt.getTime()) ? new Date(NaN) : dt; }
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayStr = () => toISO(new Date());
const beYear = (y) => y + 543;

const fmtDateLong = (s) => { const d = parseDate(s); return `วัน${TH_DAYS[d.getDay()]}ที่ ${d.getDate()} ${TH_MONTHS[d.getMonth()]} พ.ศ. ${beYear(d.getFullYear())}`; };
const fmtDateMedium = (s) => { const d = parseDate(s); return `${d.getDate()} ${TH_MONTHS_S[d.getMonth()]} ${beYear(d.getFullYear())}`; };
const fmtDateShort = (s) => { const d = parseDate(s); return `${TH_DAYS_S[d.getDay()]} ${d.getDate()} ${TH_MONTHS_S[d.getMonth()]} ${beYear(d.getFullYear())}`; };
const baht = (n) => '฿' + Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });

function timeAgo(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const min = Math.floor(ms / 60000);
  if (min < 1) return 'เมื่อสักครู่';
  if (min < 60) return `${min} นาทีที่แล้ว`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} ชม. ที่แล้ว`;
  return `${Math.floor(hr / 24)} วันที่แล้ว`;
}
const fmtTime = (iso) => { const d = new Date(iso); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
/* build ออฟไลน์ (ไฟล์เดียว/APK): แผนที่เปิดเป็นแอป/เบราว์เซอร์แทนการฝัง iframe */
const OFFLINE_BUILD = !!window.TALAT_OFFLINE;
/* คัดลอกข้อความเข้าคลิปบอร์ด (รองรับ WebView เก่า) */
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* ไปทางสำรอง */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
/* v5.1 — Google Maps: ลิงก์เปิดแผนที่/นำทาง (มือถือเด้งแอป Google Maps ให้เอง) */
const mapsQueryOf = (mk) => (mk && mk.lat != null && mk.lng != null) ? `${mk.lat},${mk.lng}` : ((mk && mk.address) || '');
const mapsUrlOf = (mk, dir) => {
  const q = encodeURIComponent(mapsQueryOf(mk) || '');
  return dir ? `https://www.google.com/maps/dir/?api=1&destination=${q}`
             : `https://www.google.com/maps/search/?api=1&query=${q}`;
};

/* ═══════════ v5 · ภาษา / ส่งออกข้อมูล / ตรวจเบอร์โทร ═══════════ */
/* ตรวจเบร์โทรไทย (0 + 9-10 หลัก / +66) — คืนตัวเลขปกติหรือ '' */
function normalizeThaiPhone(raw) {
  let d = String(raw || '').replace(/[^0-9+]/g, '');
  if (d.startsWith('+66')) d = '0' + d.slice(3);
  else if (d.startsWith('66') && d.length === 11) d = '0' + d.slice(2);
  d = d.replace(/\D/g, '');
  return /^0[2689]\d{8}$/.test(d) || /^0[2-57]\d{7}$/.test(d) ? d : '';
}

/* สลับภาษา (ไทย ↔ EN) — ปุ่ม [data-lang] ทุกที่ */
function bindLangSwitch() {
  $$('#lang-switch-side, #lang-switch-start, #lang-switch-login, #lang-switch-acct').forEach((box) => {
    if (!box || box.__bound) return;
    box.__bound = true;
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-lang]');
      if (!b) return;
      TS.setLang(b.dataset.lang);
      syncLangButtons();
      toast(b.dataset.lang === 'en' ? 'Switched to English' : 'เปลี่ยนเป็นภาษาไทยแล้ว', 'ok');
    });
  });
  syncLangButtons();
}
function syncLangButtons() {
  $$('[data-lang]').forEach((b) => b.classList.toggle('on', b.dataset.lang === (window.TS ? TS.lang : 'th')));
}
function langSwitchHTML(id) {
  return `<div class="lang-switch" id="${id}" role="group" aria-label="ภาษา / Language">
    <button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">EN</button>
  </div>`;
}

/* ── ระบบส่งออก v5.4: บันทึกไฟล์ได้จริงทั้งบนเบราว์เซอร์และ APK ──
   APK (WebView): ส่ง base64 ให้ฝั่ง Java เขียนลง Downloads ผ่าน TalatNative
   เบราว์เซอร์: สร้าง blob + คลิกลิงก์โหลดตามปกติ */
function b64FromStr(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function saveFileAny(filename, mime, content) {
  if (window.TalatNative && TalatNative.saveFile) {
    try {
      const r = TalatNative.saveFile(filename, mime, b64FromStr(content));
      if (r && r.indexOf('ok:') === 0) return { ok: true, path: r.slice(3) };
      return { ok: false, err: r || 'บันทึกไฟล์ไม่สำเร็จ (APK)' };
    } catch (e) { return { ok: false, err: e.message }; }
  }
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return { ok: true, browser: true };
  } catch (e) {
    return { ok: false, err: e.message };
  }
}
function toastSavedFile(res, doneMsg) {
  if (!res || !res.ok) { toast((res && res.err) || 'ส่งออกไม่สำเร็จ', 'err'); return; }
  if (res.path) toast((TS.translate('บันทึกไฟล์แล้ว') + ': ' + res.path + ' — ' + TS.translate('เปิดดูได้ในแอป "ไฟล์" → Downloads')), 'ok');
  else toast(doneMsg, 'ok');
}

/* ส่งออก CSV (มี BOM — เปิดใน Excel ได้ทันที) — หัวคอลัมน์/ค่าไทยแปลตามภาษาที่เลือก */
function downloadCSV(filename, headers, rows) {
  const tr = (s) => (window.TS && TS.translate ? TS.translate(String(s)) : String(s));
  const esc = (v) => '"' + tr(v).replace(/"/g, '""') + '"';
  const csv = '\uFEFF' + [headers.map(tr), ...rows].map((r) => r.map(esc).join(',')).join('\r\n');
  return saveFileAny(filename, 'text/csv;charset=utf-8', csv);
}

/* คัดลอกตารางเป็น TSV ไปคลิปบอร์ด (วางใน Excel/Sheets/แชทได้เลย) */
async function copyRows(headers, rows) {
  const tsv = [headers, ...rows].map((r) => r.join('\t')).join('\n');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(tsv);
      return true;
    }
  } catch (e) { /* ไป fallback */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = tsv;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const okCopy = document.execCommand('copy');
    ta.remove();
    return okCopy;
  } catch (e) { return false; }
}
async function exportCopyRows(headers, rows, n) {
  const okCopy = await copyRows(headers, rows);
  toast(okCopy
    ? TS.translate(`คัดลอกแล้ว — วางได้ทุกที่ (Excel/แชท)`) + ' (' + n + ' ' + TS.translate('รายการ') + ')'
    : TS.translate('คัดลอกไม่สำเร็จ'), okCopy ? 'ok' : 'err');
}

/* โมดัลรวมส่งออก: ปุ่มเดียว → เลือก CSV / PDF / คัดลอก */

const EXPORT_FORMATS = {
  csv: { icon: '📊', name: 'CSV — เปิดใน Excel ได้ทันที', desc: 'ไฟล์ตารางข้อมูล เปิดใน Excel / Google Sheets ได้เลย' },

  copy: { icon: '📋', name: 'คัดลอกทั้งหมด (คลิปบอร์ด)', desc: 'คัดลอกข้อมูลไปวางใน Excel / แชทได้เลย' },
};
function exportOptions(list) {
  /* list = [['csv', run], ['pdf', run], ['copy', run]] */
  return list.map(([k, run]) => ({ ...EXPORT_FORMATS[k], run }));
}

/* พิมพ์รายงาน (เปิดหน้าต่างใหม่สไตล์กระดาษ → Ctrl+P / บันทึกเป็น PDF ได้) — แปลตามภาษาที่เลือก */
function printReport(title, sub, bodyHtml) {
  const tr = (s) => (window.TS && TS.translate ? TS.translate(String(s)) : String(s));
  title = tr(title);
  sub = tr(sub);
  if (window.TS && TS.translateNode) {
    try {
      const tmp = document.createElement('div');
      tmp.innerHTML = bodyHtml;
      TS.translateNode(tmp);
      bodyHtml = tmp.innerHTML;
    } catch (e) { /* แปลไม่ได้ก็ใช้ต้นฉบับ */ }
  }
  const css = `
    * { box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans Thai', 'Segoe UI', Tahoma, sans-serif; color: #1c2a22; margin: 0; padding: 28px 30px; }
    h1 { font-size: 21px; margin: 0 0 2px; }
    .sub { color: #556; font-size: 12.5px; margin-bottom: 16px; }
    .meta { font-size: 11.5px; color: #889; margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { background: #0e3729; color: #fff; text-align: left; padding: 7px 9px; }
    td { padding: 6px 9px; border-bottom: 1px solid #dde5df; }
    tr:nth-child(even) td { background: #f4f8f5; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .totals { margin-top: 14px; font-size: 13px; }
    .totals b { font-size: 15px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; background: #e9f3ec; font-size: 11px; }
    @media print { body { padding: 0; } }
  `;
  const fullHtml =
    '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + css + '</style></head><body>' +
    '<h1>🏪 TalatSuite — ' + esc(title) + '</h1>' +
    '<p class="sub">' + esc(sub) + '</p>' +
    '<p class="meta">' + tr('ออกรายงานเมื่อ') + ' ' + tr(fmtDateMedium(todayStr())) + ' ' + tr(fmtTime(new Date().toISOString()) + ' น.') + ' · TalatSuite v5</p>' +
    bodyHtml +
    '</body></html>';
  /* APK: ส่ง HTML ให้ฝั่งแอปเปิดหน้าจอ "พิมพ์" ของระบบ (เลือกเครื่องพิมพ์ / บันทึกเป็น PDF ได้) */
  if (window.TalatNative && TalatNative.printReport) {
    try {
      const r = TalatNative.printReport(title, b64FromStr(fullHtml));
      if (r && r.indexOf('ok') === 0) return;
      toast(r || 'เปิดหน้าจอพิมพ์ไม่สำเร็จ', 'err');
    } catch (e) { toast(e.message, 'err'); }
    return;
  }
  /* เบราว์เซอร์: เปิดหน้าต่างใหม่สไตล์กระดาษ → สั่งพิมพ์อัตโนมัติ */
  const w = window.open('', '_blank');
  if (!w) {
    openModal({
      title: 'พิมพ์รายงาน', sub, icon: IC.receipt, center: true,
      body: `<div class="hint" style="padding:6px 2px">ป๊อปอัปถูกบล็อก — อนุญาตป๊อปอัปของหน้านี้แล้วกดอีกครั้ง หรือเลือกรูปแบบอื่นในหน้าส่งออก</div>`,
    });
    return;
  }
  w.document.write(fullHtml + '<script>setTimeout(function(){window.print()}, 250)<\/script>');
  w.document.close();
}

/* โหลด/บันทึกออเดอร์แขก (ไม่สมัคร) */

async function api(path, { method = 'GET', body } = {}) {
  const token = store.get('talatsuite.token');
  const opts = {
    method,
    headers: {
      ...(body ? { 'Content-Type': 'application/json' } : {}),
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  };
  /* เน็ตขัดข้อง (เซิร์ฟเวอร์กำลังตื่นจากโหมดพักของแผนฟรี / รีสตาร์ทสั้น ๆ)
     — GET ลองใหม่อัตโนมัติ 1 ครั้ง · POST ไม่ส่งซ้ำอัตโนมัติ (กันออเดอร์ซ้ำ) แต่แจ้งเตือนเป็นภาษาคน */
  let res;
  try {
    res = await fetch(path, opts);
  } catch (netErr) {
    if (method === 'GET') {
      await new Promise((r) => setTimeout(r, 4000));
      try { res = await fetch(path, opts); }
      catch (e2) { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ระบบอาจกำลังตื่นจากโหมดพัก (แผนฟรี) รอสักครู่แล้วลองใหม่ครับ'); }
    } else {
      throw new Error('การเชื่อมต่อขัดข้องกลางคัน — ระบบอาจกำลังตื่นจากโหมดพัก กรุณารอ 1 นาทีแล้วกดส่งใหม่ครับ (ห้ามรีเฟรชซ้ำ ๆ)');
    }
  }
  let data = null;
  try { data = await res.json(); } catch { /* no body */ }
  /* 401 จาก endpoint ยืนยันตัวตน (รหัสผ่าน/รหัสล็อคผิด) เป็นเรื่องปกติ — ห้ามไล่ออก */
  const isAuthProbe = /^\/api\/auth\/(login|register|password|passcode|verify-passcode)/.test(path);
  if (res.status === 401 && state.user && !isAuthProbe) {
    /* เซสชันหมดอายุ — ล้างแล้วให้เข้าสู่ระบบใหม่ */
    logoutLocal();
    toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง', 'err');
  }
  if (!res.ok) throw new Error(
    (data && data.error)
    || (res.status >= 500 ? 'ระบบขัดข้องชั่วคราว — รอสักครู่แล้วลองใหม่ครับ' : `เกิดข้อผิดพลาด (${res.status})`)
  );
  return data;
}

/* ที่เก็บข้อมูลในเครื่อง (ปลอดภัยเมื่อ localStorage ถูกบล็อก เช่น iframe sandbox) */
const store = (() => {
  let ok = false; const mem = {};
  try { const t = '__talat_probe__'; localStorage.setItem(t, '1'); localStorage.removeItem(t); ok = true; } catch (e) { ok = false; }
  return {
    ok,
    get(k) { try { return ok ? localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return null; } },
    set(k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch (e) {} },
    del(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) {} },
  };
})();

/* ─────────────── เสียงแจ้งเตือน (WebAudio สั้น ๆ) ─────────────── */
function beep(kind = 'new') {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    beep.ctx = beep.ctx || new AC();
    const ctx = beep.ctx;
    if (ctx.state === 'suspended') ctx.resume();
    const seq = kind === 'new' ? [[880, 0], [1318, 0.14]] : [[660, 0], [880, 0.12]];
    for (const [freq, at] of seq) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      const t = ctx.currentTime + at;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.start(t); o.stop(t + 0.45);
    }
  } catch (e) { /* เงียบได้ */ }
}

/* ─────────────── toast ─────────────── */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="t-ic">${type === 'ok' ? '✓' : type === 'err' ? '!' : 'ⓘ'}</span><span>${esc(msg)}</span>`;
  toastRoot.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 280); }, 2700);
  while (toastRoot.children.length > 3) toastRoot.firstChild.remove();
}

/* ─────────────── modal system ─────────────── */
let modalZ = 100;
function openModal({ title = '', sub = '', icon = '', body = '', className = '', center = false, onDismiss } = {}) {
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop' + (center ? ' center' : '');
  bd.style.zIndex = ++modalZ;
  bd.innerHTML = `
    <div class="sheet ${className}" role="dialog" aria-modal="true">
      ${center ? '' : '<div class="sheet-grab"><i></i></div>'}
      <div class="sheet-head">
        ${icon ? `<span class="sh-ic">${icon}</span>` : ''}
        <div style="min-width:0;flex:1"><h3>${esc(title)}</h3>${sub ? `<p>${sub}</p>` : ''}</div>
        <button class="x-btn" type="button" aria-label="ปิดหน้าต่าง">✕</button>
      </div>
      <div class="sheet-body"></div>
    </div>`;
  overlayRoot.appendChild(bd);
  const sheetEl = bd.querySelector('.sheet');
  const bodyEl = sheetEl.querySelector('.sheet-body');
  bodyEl.innerHTML = body;
  const modal = {
    el: sheetEl, body: bodyEl, backdrop: bd,
    close() { bd.remove(); },
  };
  const dismiss = () => { modal.close(); if (onDismiss) onDismiss(); };
  bd.addEventListener('pointerdown', (e) => { if (e.target === bd) dismiss(); });
  sheetEl.querySelector('.x-btn').addEventListener('click', dismiss);
  return modal;
}

/* ─────────────── ปฏิทิน ─────────────── */
function openCalendar(selected) {
  return new Promise((resolve) => {
    let done = false;
    const fin = (v) => { if (!done) { done = true; resolve(v); } };
    const sel = parseDate(selected);
    let vy = sel.getFullYear(), vm = sel.getMonth();
    let token = 0;

    const m = openModal({
      title: 'เลือกวันที่ใช้งาน',
      sub: 'จุดสีเขียว = วันที่มีรายการชำระเงิน',
      icon: IC.calendar,
      className: 'cal-box',
      body: `
        <div class="cal-head">
          <button class="cal-nav" id="cal-prev" type="button" aria-label="เดือนก่อนหน้า">${IC.chevL}</button>
          <h4 id="cal-title"></h4>
          <button class="cal-nav" id="cal-next" type="button" aria-label="เดือนถัดไป">${IC.chevR}</button>
        </div>
        <div class="cal-dow">${['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'].map((d) => `<span>${d}</span>`).join('')}</div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-foot">
          <button class="btn ghost block" id="cal-today" type="button">ใช้วันนี้ (${fmtDateMedium(todayStr())})</button>
        </div>`,
      onDismiss: () => fin(null),
    });

    const grid = m.body.querySelector('#cal-grid');

    async function renderMonth() {
      const myToken = ++token;
      m.body.querySelector('#cal-title').textContent = `${TH_MONTHS[vm]} ${beYear(vy)}`;
      const lead = new Date(vy, vm, 1).getDay();
      const dim = new Date(vy, vm + 1, 0).getDate();
      let html = '';
      for (let i = 0; i < lead; i++) html += '<span></span>';
      for (let d = 1; d <= dim; d++) {
        const ds = toISO(new Date(vy, vm, d));
        const cls = ['cal-day'];
        if (ds === selected) cls.push('sel');
        if (ds === todayStr()) cls.push('today');
        html += `<button type="button" class="${cls.join(' ')}" data-d="${ds}">${d}<span class="pay-dot" hidden></span></button>`;
      }
      grid.innerHTML = html;
      try {
        const from = toISO(new Date(vy, vm, 1));
        const to = toISO(new Date(vy, vm + 1, 0));
        const mid = state.role === 'manager' ? `&market_id=${state.manager.marketId || 1}` : '';
        const data = await api(`/api/market/payments?from=${from}&to=${to}${mid}`);
        if (myToken !== token) return;
        const days = new Set(data.payments.map((p) => p.day));
        $$('.cal-day', grid).forEach((b) => {
          if (days.has(b.dataset.d)) b.querySelector('.pay-dot').hidden = false;
        });
      } catch { /* ไม่แสดงจุดก็ได้ */ }
    }

    m.body.querySelector('#cal-prev').addEventListener('click', () => { vm--; if (vm < 0) { vm = 11; vy--; } renderMonth(); });
    m.body.querySelector('#cal-next').addEventListener('click', () => { vm++; if (vm > 11) { vm = 0; vy++; } renderMonth(); });
    m.body.querySelector('#cal-today').addEventListener('click', () => {
      const t = new Date();
      vy = t.getFullYear(); vm = t.getMonth();
      renderMonth();
    });
    grid.addEventListener('click', (e) => {
      const b = e.target.closest('.cal-day');
      if (!b) return;
      fin(b.dataset.d);
      m.close();
    });
    renderMonth();
  });
}

/* ── ป้ายจำนวนใบสมัครรอพิจารณา (ปุ่ม "ใบสมัคร" บน nav) ── */
function paintAppBadge(n) {
  state.pendingApps = n;
  $$('#side-nav .nav-pad[data-nav="apps"], #bottombar .bb-pad[data-nav="apps"]').forEach((b) => {
    let el = b.querySelector('.nav-badge');
    if (!el) {
      el = document.createElement('span');
      el.className = 'nav-badge';
      b.appendChild(el);
    }
    el.textContent = n > 99 ? '99+' : String(n);
    el.style.display = n > 0 ? '' : 'none';
  });
}

async function refreshAppBadge() {
  try {
    let n = null;
    if (state.user && state.user.role === 'admin') {
      const all = await api('/api/admin/applications');
      let apps = (all.applications || []).filter((a) => a.status === 'pending');
      /* แอดมินที่เปิดคอนโซลตลาด → นับเฉพาะตลาดนั้น (เหมือนหน้าใบสมัคร) */
      if (state.role === 'manager') apps = apps.filter((a) => a.kind === 'shop' && Number(a.market_id) === Number(state.manager.marketId));
      n = apps.length;
    } else if (state.role === 'manager') {
      const data = await api('/api/manager/applications');
      n = (data.applications || []).filter((a) => a.status === 'pending').length;
    }
    if (n === null) return;
    /* มีใบสมัครใหม่เข้าระหว่างแอปเปิดอยู่ → เตือนทันที */
    if (typeof state.pendingApps === 'number' && n > state.pendingApps) {
      beep('new');
      toast(`📨 มีใบสมัครใหม่รอพิจารณา (${n} ใบ)`, 'ok');
    }
    paintAppBadge(n);
  } catch (e) { /* แค่ป้าย — เงียบไว้ */ }
}

function updateNavOn() {
  const cur = currentTabId();
  $$('#side-nav .nav-pad, #bottombar .bb-pad').forEach((b) => {

/* ── PWA: ติดตั้งแอป + แจ้งเตือนระบบ (ทำงานเหมือนแอปจริง) ── */
function setupPWA() {
  /* ลงทะเบียน service worker (แคชหน้าแอปไว้ เปิดเร็ว/ออฟไลน์ได้) */
  /* หมายเหตุ: อ่าน property ผ่าน try/catch — iframe sandbox ที่ไม่มี allow-same-origin
     จะโยน SecurityError ตั้งแต่ขั้น `'serviceWorker' in navigator` ซึ่งเคยทำให้ init()
     ล้มทั้งก้อนในโหมดพรีวิว (§8) — ต้องไม่พัง boot */
  let sw = null;
  try { sw = ('serviceWorker' in navigator) ? navigator.serviceWorker : null; } catch (e) { sw = null; }
  if (sw) {
    try { sw.register('/sw.js').catch(() => {}); } catch (e) {}
  }
  /* เบราว์เซอร์พร้อมให้ติดตั้ง → เก็บ event ไว้ให้ปุ่ม "ติดตั้งแอป" เรียก */
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    state.installPrompt = e;
    const box = document.querySelector('.welcome-actions .start-links');
    if (box && !$('#install-btn')) {
      const div = document.createElement('div');
      div.className = 'start-install';
      div.innerHTML = '<button class="btn gold" id="install-btn" type="button">📱 ติดตั้งแอปบนหน้าจอหลัก</button><small>ใช้เหมือนแอปปกติ · เปิดเร็ว · มีไอคอนของตัวเอง</small>';
      box.after(div);
      div.querySelector('#install-btn').addEventListener('click', async () => {
        const ev = state.installPrompt;
        if (!ev) return;
        try { await ev.prompt(); } catch (e2) {}
        state.installPrompt = null;
        div.remove();
      });
    }
  });
  window.addEventListener('appinstalled', () => {
    state.installPrompt = null;
    document.querySelector('.start-install')?.remove();
    toast('📱 ติดตั้งแอปเรียบร้อย — เปิดจากไอคอนได้เลย', 'ok');
    setTimeout(maybeAskNotifications, 1200);
  });
}

/* ── ถามสิทธิ์แจ้งเตือนระบบครั้งแรก (หลังล็อกอิน/ติดตั้งแอป) ── */
function maybeAskNotifications() {
  try {
    if (typeof Notification === 'undefined') return;
    if (Notification.permission !== 'default') return;          /* granted/denied ไปแล้ว */
    if (store.get('talatsuite.notiAsked')) return;              /* เคยถามแล้วไม่ถามซ้ำ */
    const u = state.user;
    const benefit = !u ? 'ลูกค้า: แจ้งเมื่ออาหารพร้อม'
      : u.role === 'vendor' ? 'ร้านค้า: แจ้งทันทีที่มีออเดอร์ใหม่ + คิวครัว'
      : (u.role === 'admin' || u.role === 'manager') ? 'ผู้จัดการ: แจ้งเมื่อมีใบสมัครใหม่เข้ามา'
      : 'ลูกค้า: แจ้งเมื่ออาหารพร้อม';
    const md = openModal({
      title: '🔔 เปิดแจ้งเตือนไหมครับ?',

        <p class="hint" style="text-align:center">เปิดไว้แล้วจะไม่พลาดออเดอร์และความเคลื่อนไหวสำคัญ — ปิดที่หน้า "ออเดอร์ของฉัน" ได้ตลอด</p>
        <button class="btn primary block" id="noti-yes" type="button">เปิดแจ้งเตือน</button>
        <button class="btn ghost block" id="noti-later" type="button" style="margin-top:8px">ไว้ก่อน</button>`,
    });
    md.body.querySelector('#noti-yes').addEventListener('click', async () => {
      const ok = await askNotifyPermission();
      toast(ok ? '🔔 เปิดแจ้งเตือนแล้ว' : 'เบราว์เซอร์ไม่อนุญาต — เปิดใหม่ได้ที่หน้าออเดอร์', ok ? 'ok' : 'err');

    });
    md.body.querySelector('#noti-later').addEventListener('click', () => md.close());
    store.set('talatsuite.notiAsked', '1');
  } catch (e) { /* ไม่ซีเรียส */ }
}
